name: Verify HyperGlow

on:
  push:
    branches:
      - main
      - "trae/agent-**"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test and build debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperglow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          TAG="debug-${GITHUB_SHA::7}"
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "HyperGlow debug ${GITHUB_SHA::7}" \
            --notes "Automated debug build from commit ${GITHUB_SHA}.

          This is an unverified debug build for testing the experimental-mode toggle and AOD version whitelist changes. Not for production use." \
            --prerelease
